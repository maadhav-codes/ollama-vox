audio:
  sample_rate: 16000
  vad_enabled: true
  vad_threshold: 0.015
  vad_silence_seconds: 1.2
  max_duration_seconds: 20

# Relative model paths use the folder selected during setup, or
# ~/Documents/ollama-vox/models. Absolute paths and ~ are supported.
stt:
  model: ./whisper/whisper-small.en-mlx-q4

ollama:
  endpoint: http://localhost:11434
  model: llama3.2:1b-instruct-q4_K_M
  temperature: 0.7
  # Disable hidden reasoning for faster spoken responses; null uses model default.
  think: false

tts:
  model: ./kokoro/Kokoro-82M-4bit
  voice: af_bella
  rate: 1.0
  sample_rate: 24000
  split_chars: 180

queue:
  maxsize: 4
  drop_policy: drop_oldest

interaction:
  push_to_talk_enabled: true
  push_to_talk_hotkey: "<ctrl>+<alt>+<space>"
  audio_cues_enabled: true
  audio_cues_volume: 0.25

response_style: neutral

styles:
  neutral:
    speed: 1.0
  calm:
    speed: 0.92
    pitch: -0.2
  excited:
    speed: 1.12
    pitch: 0.4
