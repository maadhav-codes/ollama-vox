[project]
name = "ollama-vox"
version = "1.0.3"
description = "Local macOS menubar voice assistant powered by MLX Whisper, Ollama, and Kokoro TTS"
authors = [{name = "Mayur Dayal"}]
readme = "README.md"
# Python 3.12.0–3.12.9 expose a CPython importlib incompatibility with
# ``six.moves`` (``_SixMetaPathImporter`` has no ``_path``).  Require the
# first patched 3.12 release so fresh installs cannot select those versions.
requires-python = ">=3.12.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]
dependencies = [
    "huggingface-hub>=1.12.2",
    "misaki[en]>=0.9.4",
    "spacy>=3.8.0",
    "mlx-audio>=0.4.3",
    "mlx-whisper>=0.4.3",
    "numpy>=2.2.6",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "pyside6>=6.8.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/maadhav-codes/ollama-vox"
Repository = "https://github.com/maadhav-codes/ollama-vox.git"
Issues = "https://github.com/maadhav-codes/ollama-vox/issues"

[project.scripts]
ollama-vox = "ollama_vox.main:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=81.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ollama_vox*"]

[tool.setuptools.package-data]
"ollama_vox" = ["config.yaml", "assets/cues/*.wav"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "rich>=15.0.0",
]
